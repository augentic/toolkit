# Rust code-quality tasks, included from `mise.toml` via `task_config.includes`.
# Install: `curl https://mise.run | sh`
# Help: https://mise.jdx.dev/tasks/
#:schema https://mise.jdx.dev/schema/mise-task.json
#
# Consumer knobs, set under `[env]` in the consuming `mise.toml`, each the
# repository's own value for what its caller workflow passes as an input:
#   WASM32_PACKAGES  space-separated workspace members linted for wasm32-wasip2
#                    by `lint-wasm`; unset = whole workspace. Mirrors the
#                    `wasm-packages` input of `.github/workflows/ci.yaml`.
#   OUTDATED_IGNORE  comma-separated crates `outdated` ignores. Mirrors the
#                    `outdated` input of `.github/workflows/audit.yaml`.

# -------------------------------------
# CI Checks
# -------------------------------------

# `run` steps execute in order (`depends` would run them in parallel), so
# `fmt` finishes rewriting sources before anything lints them.
[check]
description = "Local pre-push checks: audit, fmt, lint, outdated, deps"
run = [
  { task = "audit" },
  { task = "fmt" },
  { task = "lint" },
  { task = "outdated" },
  { task = "deps" },
]

# Exactly the jobs of `.github/workflows/ci.yaml`, one task per job (see the
# "Mirror" table in README.md). Advisory extras live in `check`.
[ci]
description = "Everything CI runs, in order"
run = [
  { task = "fmt-check" },
  { task = "lint" },
  { task = "test" },
  { task = "test-docs" },
  { task = "docs" },
  { task = "vet" },
  { task = "deny" },
]

# -------------------------------------
# Individual Actions
# -------------------------------------

[audit]
description = "Check Cargo.lock against the RustSec advisory database"
depends = ["install audit"]
run = "cargo audit"

[deny]
description = "Check licenses, bans, advisories and sources"
depends = ["install deny"]
run = "cargo deny --workspace check"

[deps]
description = "Find unused dependencies (nightly)"
depends = ["install udeps"]
run = "cargo +nightly udeps --all-targets"

[fmt]
description = "Format all crates in place (nightly rustfmt)"
run = "cargo +nightly fmt --all"

[fmt-check]
description = "Fail if any crate is not formatted (nightly rustfmt, mirrors CI)"
run = "cargo +nightly fmt --all --check"

# Lint every line of code: natively first (all targets with everything on,
# then each crate in each single-feature configuration), then the same two
# passes for `wasm32-wasip2` over lib + bins + examples only. `run` keeps the
# order so host errors surface before the slower cross-target pass.
[lint]
description = "Clippy with -D warnings: host (lint-host) then wasm32-wasip2 (lint-wasm)"
env = { RUSTFLAGS = "-Dwarnings" }
run = [{ task = "lint-host" }, { task = "lint-wasm" }]

[lint-host]
description = "Clippy natively: all targets with all features, then each feature"
depends = ["install hack"]
env = { RUSTFLAGS = "-Dwarnings" }
run = [
  "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings",
  "cargo hack clippy --locked --workspace --each-feature --exclude-all-features -- -D warnings",
]

# The wasm32 pass never builds tests or benches: integration tests and their
# dev-dependencies are host-only in most workspaces. Any bin or example inside
# the scope that is host-only must be cfg-gated to an empty `main` on wasm32.
# The each-feature pass uses cargo's default targets (lib + bins) because
# cargo-hack forwards `--lib`/`--examples` verbatim to packages without them.
[lint-wasm]
description = "Clippy for wasm32-wasip2: lib, bins and examples (WASM32_PACKAGES narrows the workspace)"
depends = ["install hack"]
env = { RUSTFLAGS = "-Dwarnings" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
scope=(--workspace)
if [ -n "${WASM32_PACKAGES:-}" ]; then
  scope=(); for p in $WASM32_PACKAGES; do scope+=(-p "$p"); done
fi
cargo clippy --locked "${scope[@]}" --lib --bins --examples --all-features --target wasm32-wasip2 -- -D warnings
cargo hack clippy --locked "${scope[@]}" --each-feature --exclude-all-features --target wasm32-wasip2 -- -D warnings
'''

[outdated]
description = "Fail on outdated direct dependencies (OUTDATED_IGNORE skips crates)"
depends = ["install outdated"]
run = 'cargo outdated --workspace --exit-code 1 --depth 1 ${OUTDATED_IGNORE:+--ignore "$OUTDATED_IGNORE"}'

# Mirrors the CI `test` job: one feature-unified build and one nextest run.
# Per-feature compile coverage is `lint`'s job.
[test]
description = "nextest across the workspace with all features (includes the examples gate)"
depends = ["install nextest"]
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo nextest run --workspace --all-features --locked --no-tests=pass"

[docs]
description = "Build rustdoc for the workspace, failing on warnings"
env = { RUSTFLAGS = "-Dwarnings", RUSTDOCFLAGS = "-Dwarnings" }
run = "cargo doc --no-deps --workspace --all-features --locked"

# Mirrors the CI `test-doc` job, lib detection included: `cargo test --doc`
# errors on a workspace with no library target instead of testing nothing.
[test-docs]
description = "Run doc tests (nothing to run in a workspace without a library target)"
env = { RUSTFLAGS = "-Dwarnings" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
if cargo metadata --format-version 1 --no-deps \
  | grep -Eq '"kind":\[[^]]*"(lib|rlib|cdylib|dylib|staticlib|proc-macro)"'; then
  cargo test --doc --all-features --workspace --locked
else
  echo "no library target in the workspace; no doc tests to run"
fi
'''

# Check-only, like the CI `vet` job. `vet-regen` refreshes the supply-chain
# files first.
[vet]
description = "Check the supply-chain audit (cargo vet --locked)"
depends = ["install vet"]
run = "cargo vet --locked"

[vet-regen]
description = "Regenerate cargo-vet imports/exemptions/unpublished, then vet"
depends = ["install vet"]
run = [
  "cargo vet regenerate imports",
  "cargo vet regenerate exemptions",
  "cargo vet regenerate unpublished",
  "cargo vet --locked",
]

# -------------------------------------
# Helpers (not part of ci)
# -------------------------------------

# Equivalent of cargo-make's `install_crate`: install a cargo subcommand only
# when it is not already on PATH. Used as `depends = ["install <subcommand>"]`.
[install]
hide = true
description = "Install cargo-<subcommand> if missing"
usage = 'arg "<subcommand>" help="cargo subcommand, e.g. hack for cargo-hack"'
run = 'command -v "cargo-${usage_subcommand?}" >/dev/null 2>&1 || cargo install --locked "cargo-${usage_subcommand?}"'

[cov]
description = "Test coverage summary (cargo llvm-cov over nextest)"
depends = ["install llvm-cov", "install nextest"]
run = "cargo llvm-cov nextest --workspace --all-features --summary-only"

# Dry run of what the `Publish Release` workflow's crates job executes; the
# only pre-release check that every publishable member packages and verifies.
[publish]
description = "Dry-run publishing every publishable workspace member"
run = "cargo publish --workspace --locked --dry-run"

[miri]
description = "Run the test suite under Miri (nightly)"
depends = ["install nextest"]
run = ["cargo +nightly miri setup", "cargo +nightly miri nextest run --no-tests=pass"]

[clean]
description = "Remove the target directory"
run = "cargo clean"

[sweep]
description = "Remove old/unused build artifacts"
depends = ["install sweep"]
run = "cargo sweep --time 7"
