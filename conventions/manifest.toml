# Every file `conventions sync` manages in a consumer, by mode. A `source` is
# a path under this directory; a `target` a path under the consumer root.
#
# A block's name is its source path under `conventions/`, extension included;
# a block-mode file the consumer lacks is created as `preamble` plus the
# blocks.

# -------------------------------------
# Whole files: written verbatim, under the managed notice where the format
# takes comments (`hash` for `#`, `html` for `<!-- -->`, `none`).
# -------------------------------------

[[whole]]
source = "rustfmt.toml"
target = "rustfmt.toml"
header = "hash"

[[whole]]
source = "taplo.toml"
target = "taplo.toml"
header = "hash"

[[whole]]
source = "Makefile"
target = "Makefile"
header = "hash"

[[whole]]
source = "LICENSE-MIT"
target = "LICENSE-MIT"
header = "none"

[[whole]]
source = "LICENSE-APACHE"
target = "LICENSE-APACHE"
header = "none"

[[whole]]
source = "CODE_OF_CONDUCT.md"
target = "CODE_OF_CONDUCT.md"
header = "html"

[[whole]]
source = "GOVERNANCE.md"
target = "GOVERNANCE.md"
header = "html"

[[whole]]
source = "renovate.json"
target = "renovate.json"
header = "none"

# -------------------------------------
# Marker blocks inside files the consumer owns, from a `BEGIN Managed by
# augentic/toolkit` line to its `END` line.
# -------------------------------------

[[block]]
target = "AGENTS.md"
preamble = "# Agent Instructions\n"
sources = [
  "agents/git.md",
  "agents/code-style.md",
  "agents/comments.md",
  "agents/testing.md",
  "agents/commands.md",
]

[[block]]
target = "CONTRIBUTING.md"
preamble = "# Contributing\n"
sources = [
  "contributing/dco.md",
  "contributing/pull-requests.md",
  "contributing/conduct.md",
]

[[block]]
target = ".gitignore"
sources = ["gitignore/head"]

[[block]]
target = ".github/dependabot.yml"
preamble = "version: 2\nupdates:\n"
sources = ["dependabot/actions.yml"]

# -------------------------------------
# TOML tables owned by key: every key a source sets is held at the source's
# value, wherever the consumer's file keeps it; every other key of the file is
# the consumer's. `retired` lists the dotted keys a source once set, removed
# from the file when present.
# -------------------------------------

[[table]]
target = "Cargo.toml"
sources = ["lints/rust.toml", "lints/clippy.toml"]

[[table]]
target = "deny.toml"
sources = ["deny/advisories.toml", "deny/licenses.toml"]

[[table]]
target = "supply-chain/config.toml"
sources = ["vet/imports.toml"]

[[table]]
target = "rust-toolchain.toml"
sources = ["rust-toolchain.toml"]
