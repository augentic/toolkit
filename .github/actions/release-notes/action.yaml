name: Prepare release notes
description: Prepare release notes for an upcoming release

inputs:
  version:
    description: The version to use for release notes.
    required: true
  previous-version:
    description: |
      The version that precedes `version`. For 'next' this is the version
      being released (used for the archive link); for 'patch' it is the
      version being patched (used to re-title the previous notes).
      Required for 'next' and 'patch'.
    default: ""
  previous-tag:
    description: |
      The highest tag below `version`, from the `previous-tag` action, or
      empty when the repository has none. Bounds GitHub's generated notes
      for 'major', 'minor', and 'patch'.
    default: ""
  draft:
    description: |
      Path to the drafted notes for `version`: categorised Markdown under
      `### ` headings, with no `## ` heading and no `---` rule. The file may
      be absent or empty; GitHub's generated notes are used in its place.
    default: ""
  release-type:
    description: One of 'major', 'minor', 'patch', or 'next'.
    default: major

runs:
  using: composite
  steps:
    - name: Read the draft
      if: ${{ inputs.release-type != 'next' }}
      id: draft
      shell: bash
      env:
        DRAFT: ${{ inputs.draft }}
      run: |
        set -euo pipefail
        if [ -n "$DRAFT" ] && [ -s "$DRAFT" ]; then
          echo "drafted=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::no drafted release notes; using the notes GitHub generates"
          echo "drafted=false" >> "$GITHUB_OUTPUT"
        fi

    # `target_commitish` pins the notes to the triggering commit; without it
    # GitHub compares against the default branch, which is wrong on release
    # branches.
    - name: Generate release notes
      if: ${{ inputs.release-type != 'next' && steps.draft.outputs.drafted != 'true' }}
      id: notes
      uses: actions/github-script@v9
      env:
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
        NEW_VERSION: ${{ inputs.version }}
      with:
        result-encoding: string
        script: |
          const params = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: `v${process.env.NEW_VERSION}`,
            target_commitish: context.sha,
          };
          if (process.env.PREVIOUS_TAG) {
            params.previous_tag_name = process.env.PREVIOUS_TAG;
          }
          const response = await github.rest.repos.generateReleaseNotes(params);
          return response.data.body;

    # -------------------------------------------
    # Major/minor
    # -------------------------------------------
    # The hand-written body above the `---` rule is kept as it is. With a
    # draft, a `### ` heading with nothing beneath it (the skeleton's) is
    # dropped before the draft is appended, since the draft brings its own.
    - name: Create RELEASES.md
      if: ${{ inputs.release-type == 'major' || inputs.release-type == 'minor' }}
      shell: bash
      env:
        DRAFTED: ${{ steps.draft.outputs.drafted }}
        DRAFT: ${{ inputs.draft }}
        NOTES: ${{ steps.notes.outputs.result }}
      run: |
        set -euo pipefail
        body=$(sed -n '/---/,$!p' RELEASES.md)
        archive=$(sed -n '/---/,$p' RELEASES.md)
        if [ "$DRAFTED" = true ]; then
          body=$(awk '
            /^### / { pending = $0 "\n"; next }
            /^## / { pending = ""; print; next }
            /^[[:space:]]*$/ { if (pending != "") pending = pending $0 "\n"; else print; next }
            { printf "%s", pending; pending = ""; print }
          ' <<< "$body")
          notes=$(cat "$DRAFT")
        else
          notes=$NOTES
        fi
        {
          printf '%s\n\n' "$body"
          printf '%s\n\n' "$notes"
          printf '%s\n' "$archive"
        } > RELEASES.md.new
        mv RELEASES.md.new RELEASES.md

    # -------------------------------------------
    # Patch
    # -------------------------------------------
    # `cargo-version` has already rewritten line 1 to the patch version, so the
    # previous notes are re-titled with `previous-version` before being
    # appended below the new section. A draft carries its own headings; the
    # generated list goes under `### Fixed`.
    - name: Patch RELEASES.md
      if: ${{ inputs.release-type == 'patch' }}
      shell: bash
      env:
        DRAFTED: ${{ steps.draft.outputs.drafted }}
        DRAFT: ${{ inputs.draft }}
        NOTES: ${{ steps.notes.outputs.result }}
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
      run: |
        set -euo pipefail
        if [ -z "$PREVIOUS_VERSION" ]; then
          echo "::error::'previous-version' is required for release-type 'patch'"
          exit 1
        fi
        title=$(sed -n '1p' RELEASES.md)
        previous=$(tail -n +2 RELEASES.md | sed '/./,$!d')
        {
          printf '%s\n\n' "$title"
          printf 'Unreleased\n\n'
          if [ "$DRAFTED" = true ]; then
            printf '%s\n\n' "$(cat "$DRAFT")"
          else
            printf '### Fixed\n\n'
            printf '%s\n\n' "$NOTES"
          fi
          printf -- '---\n\n'
          printf '## %s\n\n' "$PREVIOUS_VERSION"
          printf '%s\n' "$previous"
        } > RELEASES.md.new
        mv RELEASES.md.new RELEASES.md

    # -------------------------------------------
    # Next
    # -------------------------------------------
    # Link the archive entry to the release branch that was just cut, i.e. the
    # *previous* version, not the bumped one already on line 1.
    - name: Update archive list
      if: ${{ inputs.release-type == 'next' }}
      shell: bash
      env:
        REPOSITORY: ${{ github.repository }}
        PREVIOUS_VERSION: ${{ inputs.previous-version }}
      run: |
        set -euo pipefail
        if [ -z "$PREVIOUS_VERSION" ]; then
          echo "::error::'previous-version' is required for release-type 'next'"
          exit 1
        fi
        version_x="${PREVIOUS_VERSION%.*}.x"
        sed -i "/ARCHIVE_START/a * [${version_x}](https://github.com/${REPOSITORY}/blob/release-${PREVIOUS_VERSION}/RELEASES.md)" RELEASES.md

    # The headings come with the draft at the cut, so the skeleton carries
    # none; an entry written by hand before then brings its own.
    - name: Create next release notes
      if: ${{ inputs.release-type == 'next' }}
      shell: bash
      run: |
        set -euo pipefail
        title=$(sed -n '1p' RELEASES.md)
        archive=$(sed -n '/---/,$p' RELEASES.md)
        {
          printf '%s\n\n' "$title"
          printf 'Unreleased\n\n'
          printf '%s\n' "$archive"
        } > RELEASES.md.new
        mv RELEASES.md.new RELEASES.md

    - name: Update branch with changes
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        git commit -am "Update release notes for $VERSION"
