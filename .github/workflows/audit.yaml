name: Audit

on:
  workflow_call:
    inputs:
      outdated:
        description: "List of dependencies to ignore for cargo-outdated"
        type: string

permissions:
  contents: read
  # rustsec/audit-check creates GitHub issues (schedule) and check runs.
  issues: write
  checks: write

jobs:
  security_audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # audit-check runs whatever `cargo-audit` is on PATH and otherwise
      # `cargo install`s it from source on every cache miss.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # v2.0.0 still runs on Node 20 (deprecated); pin the default-branch
      # commit that moved to Node 24 until it is released.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # v2.0.0 + Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  outdated:
    name: Outdated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-outdated

      - env:
          OUTDATED: ${{ inputs.outdated }}
        run: |
          args=(--workspace --depth 1 --exit-code 1)
          [ -n "$OUTDATED" ] && args+=(--ignore "$OUTDATED")
          cargo outdated "${args[@]}"
