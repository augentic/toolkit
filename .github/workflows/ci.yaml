# Reusable CI workflow for Rust
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows

name: CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Cargo workspace directory
        type: string
        default: "."
      targets:
        description: >-
          Comma-separated rustup targets to install (e.g. wasm32-wasip2).
          Clippy also lints lib/bins/examples once per target.
        type: string
        default: ""
      wasm-packages:
        description: >-
          Space-separated workspace members linted for each of `targets`;
          empty = whole workspace. Mirrors `WASM32_PACKAGES` in mise/rust.toml.
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  # Lockfile-only (no rustc). Compile jobs wait so a known-bad crate
  # cannot run build.rs / proc-macros before advisories fail.
  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ inputs.working-directory }}/Cargo.toml
          arguments: --workspace --locked

  clippy:
    name: Clippy
    needs: deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ inputs.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: ${{ inputs.working-directory }}
        
      - run: cargo hack clippy --locked --workspace --each-feature --exclude-all-features -- -D warnings
        working-directory: ${{ inputs.working-directory }}
        
      # Host passes skip `cfg(target_arch = "wasm32")` code, so repeat per
      # target over lib/bins/examples (tests are host-only). The each-feature
      # pass omits `--lib`/`--examples`: cargo-hack forwards them verbatim to
      # packages lacking them. Mirrors `lint-wasm` in mise/rust.toml.
      - if: inputs.targets != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          TARGETS: ${{ inputs.targets }}
          WASM_PACKAGES: ${{ inputs.wasm-packages }}
        run: |
          scope=(--workspace)
          if [ -n "$WASM_PACKAGES" ]; then
            scope=()
            read -ra packages <<< "$WASM_PACKAGES"
            for package in "${packages[@]}"; do scope+=(-p "$package"); done
          fi
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            target="${target// /}"
            [ -n "$target" ] || continue
            echo "::group::cargo clippy ${scope[*]} --lib --bins --examples --target $target"
            cargo clippy --locked "${scope[@]}" --lib --bins --examples --all-features --target "$target" -- -D warnings
            echo "::endgroup::"
            echo "::group::cargo hack clippy ${scope[*]} --each-feature --target $target"
            cargo hack clippy --locked "${scope[@]}" --each-feature --exclude-all-features --target "$target" -- -D warnings
            echo "::endgroup::"
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
          
      - run: cargo +nightly fmt --all --check
        working-directory: ${{ inputs.working-directory }}

  test:
    name: Test
    needs: deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Single all-features build: per-feature runs via cargo-hack roughly
      # doubled the job for the same tests. Per-feature coverage is in clippy.
      - run: cargo nextest run --locked --workspace --all-features --no-tests=pass
        working-directory: ${{ inputs.working-directory }}

  test-doc:
    name: Test docs
    needs: deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          cache-on-failure: true
      - id: lib
        working-directory: ${{ inputs.working-directory }}

        # Detect a lib target via cargo metadata: no throwaway compile, no
        # reliance on cargo's stderr wording.
        run: |
          has_lib=$(cargo metadata --format-version 1 --no-deps \
            | jq '[.packages[].targets[].kind[]
                   | select(IN("lib","rlib","cdylib","dylib","staticlib","proc-macro"))]
                   | length > 0')
          echo "exists=$has_lib" >> "$GITHUB_OUTPUT"
      - if: steps.lib.outputs.exists == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: cargo test --doc --locked --all-features --workspace

  doc:
    name: Docs
    needs: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          cache-on-failure: true

      - run: cargo doc --no-deps --workspace --all-features --locked
        working-directory: ${{ inputs.working-directory }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      # No prebuilt cargo-vet binaries after 0.10.0, so install-action would
      # fall back to binstall anyway. 0.10.2 matches `supply-chain/config.toml`.
      - run: cargo binstall --no-confirm cargo-vet@0.10.2
      - run: cargo vet --locked
        working-directory: ${{ inputs.working-directory }}

  # The shared conventions (README.md "Conventions"), checked with the program
  # of the toolkit revision this workflow runs from: the caller's `uses:` pin,
  # which `conventions check` holds the repository's own pins to. A repository
  # without `conventions.toml` has nothing to check. Mirrors `conventions-check`
  # in mise/rust.toml.
  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: config
        working-directory: ${{ inputs.working-directory }}
        env:
          DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [ -f conventions.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no conventions.toml under $DIRECTORY; nothing to check"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.present == 'true'
        name: Check out the toolkit
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .augentic
          persist-credentials: false
      - if: steps.config.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.config.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .augentic
          cache-on-failure: true
      - if: steps.config.outputs.present == 'true'
        run: cargo install --locked --path .augentic/crates/conventions --target-dir .augentic/target --root "$RUNNER_TEMP/toolkit"
      - if: steps.config.outputs.present == 'true'
        working-directory: ${{ inputs.working-directory }}
        run: "$RUNNER_TEMP/toolkit/bin/conventions" check
