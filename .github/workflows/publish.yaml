# Publishes a release branch.
# The workflow tags and releases the selected branch.

name: Publish Release

on:
  workflow_call:
    inputs:
      artifacts:
        description: Release artifacts to attach to the release
        type: string
        required: false
    outputs:
      version:
        description: The release version
        value: ${{ jobs.tag.outputs.version }}

permissions:
  contents: write

jobs:
  skip:
    name: Skipped
    if: startsWith(github.ref_name, 'release-') == false
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  tag:
    name: Tag release
    if: startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.cargo.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      # Check out the branch head rather than the triggering commit so that a
      # re-run sees the `Release <version>` commit pushed by an earlier attempt.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # Composite actions from this repository at the same commit as this
      # workflow, so a consumer pinned to a tag pins the actions too. Local
      # `uses:` paths must live inside the workspace; the checkout is
      # git-excluded so it never reaches the `Release <version>` commit.
      - name: Check out shared actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .augentic
          persist-credentials: false
      - run: echo '/.augentic/' >> .git/info/exclude

      - name: Set git identity
        uses: ./.augentic/.github/actions/git-identity

      - name: Cargo version
        id: cargo
        uses: ./.augentic/.github/actions/cargo-version

      # `### Needs Review` is where the drafting puts an entry it is unsure
      # of; it is resolved on the release branch and never reaches a release.
      - name: Refuse unreviewed notes
        run: |
          set -euo pipefail
          if line=$(grep -n -m 1 '^### Needs Review' RELEASES.md); then
            echo "::error file=RELEASES.md,line=${line%%:*}::RELEASES.md carries a '### Needs Review' heading; resolve the entries beneath it on the release branch before publishing"
            exit 1
          fi

      - name: Date release notes
        env:
          VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^Unreleased/Released $(date +'%Y-%m-%d')/" RELEASES.md
          if git diff --quiet -- RELEASES.md; then
            echo "RELEASES.md is already dated; nothing to commit"
          else
            git commit -am "Release $VERSION"
            git push origin
          fi

      - name: Output release notes
        id: notes
        run: |
          notes=$(cat RELEASES.md)
          {
            echo 'notes<<EOF'
            echo "${notes}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Push tag
        id: tag
        env:
          VERSION: ${{ steps.cargo.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists; skipping"
          else
            git tag -a "$tag" -m "Release $VERSION"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        if: ${{ inputs.artifacts != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifacts }}
          path: artifacts
          merge-multiple: true

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          name: Release ${{ needs.tag.outputs.tag }}
          body: ${{ needs.tag.outputs.notes }}
          immutableCreate: true
          skipIfReleaseExists: true
          # Only pass a pattern when artifacts were downloaded; an unmatched
          # pattern is reported as a warning on every run.
          artifacts: ${{ inputs.artifacts != '' && 'artifacts/*' || '' }}
