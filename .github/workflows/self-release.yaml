# Tags and releases this repository.
# The workflow reads the version from line 1 of RELEASES.md, pushes the
# `v<version>` tag and creates a GitHub release whose body is that version's
# section of RELEASES.md followed by GitHub's generated notes.
#
# Unlike `publish.yaml`, nothing is committed: `main` is governed by the org
# ruleset (PR + review + signed commits), so the release date lives on the
# GitHub release rather than in RELEASES.md. "Unreleased" is simply the
# absence of the `v<version>` tag.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: self-release

jobs:
  skip:
    name: Skipped
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow only runs on the 'main' branch"
          exit 1

  release:
    name: Tag and release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Git identity
        uses: ./.github/actions/git-identity

      # Line 1 of RELEASES.md is the single source of truth for the version.
      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n '1s/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' RELEASES.md)
          if [ -z "$version" ]; then
            echo "::error file=RELEASES.md,line=1::Line 1 of RELEASES.md must be '## MAJOR.MINOR.PATCH', found '$(sed -n 1p RELEASES.md)'"
            exit 1
          fi
          echo "Releasing $version"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      # The conventions program reports its crate version as the toolkit pin it
      # was built from, so the crate must carry the version being released.
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the crate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "conventions") | .version')
          if [ "$crate" != "$VERSION" ]; then
            echo "::error file=Cargo.toml::crates/conventions is version $crate but RELEASES.md line 1 says $VERSION; set [workspace.package] version to $VERSION"
            exit 1
          fi

      # The section under line 1 up to the next `## ` heading (or EOF), with
      # leading and trailing blank lines removed. An empty section fails the
      # run so notes are written before, not after, a release.
      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          awk '
            NR == 1 { next }
            /^## / { exit }
            { lines[++n] = $0 }
            END {
              start = 1
              while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
              end = n
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' RELEASES.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error file=RELEASES.md,line=1::No release notes found under line 1 of RELEASES.md"
            exit 1
          fi
          echo "file=$notes" >> "$GITHUB_OUTPUT"
          echo '::group::Release notes'
          cat "$notes"
          echo '::endgroup::'

      # Idempotent: a re-run after a failed release step finds the tag and
      # carries on, while a run where line 1 was never bumped stops here.
      - name: Push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "::error file=RELEASES.md,line=1::$TAG is already released; set line 1 of RELEASES.md to the next version and add its notes"
              exit 1
            fi
            echo "Tag $TAG already exists; skipping"
          else
            git tag -a "$TAG" -m "Release $VERSION"
            git push origin "refs/tags/$TAG"
          fi

      # `generateReleaseNotes` appends GitHub's "What's Changed" (filtered by
      # .github/release.yaml) after the RELEASES.md section.
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          bodyFile: ${{ steps.notes.outputs.file }}
          generateReleaseNotes: true
          immutableCreate: true
          skipIfReleaseExists: true
          makeLatest: true
