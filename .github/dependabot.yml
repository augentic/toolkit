# Keep GitHub Actions used by the reusable workflows and composite actions,
# and the conventions program's crates, up to date. The workflows' entry is
# the shared block; the composite actions and the crates are this
# repository's own.
version: 2
updates:

# BEGIN Managed by augentic/toolkit: conventions/dependabot/actions.yml
# Do not edit: run `make conventions-sync`.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # The toolkit pin is Renovate's: one pull request over every `uses:`
      # and the mise `?ref=` together (renovate.json).
      - dependency-name: "augentic/*"
# END Managed by augentic/toolkit: conventions/dependabot/actions.yml
  - package-ecosystem: github-actions
    directories:
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
