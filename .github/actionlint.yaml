# actionlint's bundled metadata for actions/create-github-app-token@v3
# predates the `client-id` input (and still marks the deprecated `app-id` as
# required). Ignore those two reports until the upstream metadata catches up.
#
# actionlint's `job` context type also predates the workflow identity
# properties (`job.workflow_repository`, `job.workflow_sha`, ...) that the
# reusable workflows use to check out their own composite actions, so those
# are reported as undefined properties. Ignore them per workflow so a typo in
# any other context property is still caught.
paths:
  .github/workflows/release.yaml:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'property "workflow_repository" is not defined in object type \{check_run_id: number;'
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number;'
  .github/workflows/publish.yaml:
    ignore:
      - 'property "workflow_repository" is not defined in object type \{check_run_id: number;'
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number;'
  .github/workflows/patch.yaml:
    ignore:
      - 'property "workflow_repository" is not defined in object type \{check_run_id: number;'
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number;'
  .github/workflows/ci.yaml:
    ignore:
      - 'property "workflow_repository" is not defined in object type \{check_run_id: number;'
      - 'property "workflow_sha" is not defined in object type \{check_run_id: number;'
